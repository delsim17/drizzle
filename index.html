<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta charset="UTF-8">
<title>Drizzle - Drake Song Guessing Game</title>
<meta name="description" content="Drizzle is a Drake song guessing game. Guess the song in 10 tries using album and track clues or audio clips in this Wordle-style music game.">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="images/icon.png">
</head>

<body>

<button id="backButton" style="display: none"><img src="images/back.png"></button>
<button id="infoButton" onclick=info()><img src="images/icircle.png"></button>

<div id="logo">
<img src="images/drizzle.png">
</div>

<div id="startDiv">
<button onclick=startClassic() class="start" id="classicButton">Classic</button>
<button onclick=startHeardle() class="start" id="heardleButton">Audio</button>
</div>

<div id="playButtonDiv">
<button onclick=playSong() id="playButton" style="display: none"><img src="images/playbutton.png"></button>
</div>

<p id="rounds" style="display: none"><span id="roundOne">0.5s</span><span id="roundTwo">1s</span><span id="roundThree">3s</span><span id="roundFour">5s</span><span id="roundFive">10s</span></p>

<div id="divTwo" style="visibility: hidden">
<input class="userInput" id="search">
<button class="userInput" id="button"> Enter </button>
<p id="error" style="visibility: hidden"></p>
</div>

<p class = "guess" id="heardleLabel" style="display:none">Song</p>
<p class = "guess" id="label" style="display:none"><span id="songLabel">Song</span><span id="albumLabel">Album</span><span id="trackLabel">Track#</span></p>

<p class = "guess" id="g1" style="display:none">  </p>
<p class = "guess" id="g2" style="display:none">  </p>
<p class = "guess" id="g3" style="display:none">  </p>
<p class = "guess" id="g4" style="display:none">  </p>
<p class = "guess" id="g5" style="display:none">  </p>
<p class = "guess" id="g6" style="display:none">  </p>
<p class = "guess" id="g7" style="display:none">  </p>
<p class = "guess" id="g8" style="display:none">  </p>
<p class = "guess" id="g9" style="display:none">  </p>
<p class = "guess" id="g10" style="display:none">  </p>
<p class = "guess" id="result" style="display:none">  </p>

<div id="againDiv">
<button onclick=startAgain() class="start" id="startAgain" style="display: none;">Play Again?</button>
</div>

<img id ="info" style="display: none" src="images/info.png"> 
<button id="xButton" style="display: none" onclick=x()>x</button>

<script src=src.js></script> 
</body>

</html>
